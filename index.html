          'Short-grain or jasmine rice'
        ],
        instructionsSnippet: 'Simmer blended onion and carrot curry sauce with chicken stock. Fry panko chicken till extra crunchy, slice into strips and drape over rice and sauce.'
      },
      {
        id: 'bbc-6',
        title: 'Greek Lemon & Oregano Chicken Souvlaki Flatbreads',
        bbcChef: 'BBC Good Food',
        matchReason: 'Perfect twin for your chicken shawarma: warm flatbreads, charred marinades, and fresh sides.',
        cookTime: '30 mins',
        protein: 'Chicken',
        tags: ['BBQ/Grill', 'Mediterranean', 'Handheld'],
        bbcUrl: 'https://www.bbcgoodfood.com/recipes/chicken-souvlaki',
        ingredients: [
          'Diced chicken breast or thighs (600g)',
          'Dried wild oregano & 1 lemon (zest & juice)',
          'Garlic cloves (3 crushed) & olive oil',
          'Greek yoghurt, grated cucumber & garlic for tzatziki',
          'Fluffy Greek pita flatbreads',
          'Vine tomatoes and red onion slices'
        ],
        instructionsSnippet: 'Skewer marinated lemon-oregano chicken and grill or griddle until smoky. Wrap into griddled warm flatbreads with cool garlic-cucumber tzatziki.'
      }
    ];

    const DAYS_OF_WEEK = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    const getMondayOfWeek = (offsetWeeks = 0) => {
      const now = new Date();
      const day = now.getDay();
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(now);
      monday.setDate(now.getDate() + diffToMonday + (offsetWeeks * 7));
      monday.setHours(0, 0, 0, 0);
      return monday;
    };

    const toWeekKey = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `week-${y}-${m}-${d}`;
    };

    const createEmptyWeek = () => ({
      Monday: { mealId: null, customTitle: '', notes: '', cook: 'Husband' },
      Tuesday: { mealId: null, customTitle: '', notes: '', cook: 'Wife' },
      Wednesday: { mealId: null, customTitle: '', notes: '', cook: 'Husband' },
      Thursday: { mealId: null, customTitle: '', notes: '', cook: 'Wife' },
      Friday: { mealId: null, customTitle: '', notes: '', cook: 'Husband' },
      Saturday: { mealId: null, customTitle: '', notes: '', cook: 'Together' },
      Sunday: { mealId: null, customTitle: '', notes: '', cook: 'Family' },
    });

    function App() {
      const [activeTab, setActiveTab] = useState('planner');
      const [isDrawerOpen, setIsDrawerOpen] = useState(true);
      const [drawerCategory, setDrawerCategory] = useState('staples');
      const [drawerSearch, setDrawerSearch] = useState('');
      const [draggedMeal, setDraggedMeal] = useState(null);
      const [dragOverDay, setDragOverDay] = useState(null);
      const [selectedWeekOffset, setSelectedWeekOffset] = useState(0);
      const [mealToAssign, setMealToAssign] = useState(null);
      const [syncStatus, setSyncStatus] = useState('Connecting...');
      const [showFirebaseModal, setShowFirebaseModal] = useState(false);
      const [firebaseModalMsg, setFirebaseModalMsg] = useState('');
      const [copiedShareLink, setCopiedShareLink] = useState(false);

      // Check URL parameters for one-tap auto sync setup from link
      const [firebaseConfigInput, setFirebaseConfigInput] = useState(() => {
        try {
          if (typeof window !== 'undefined') {
            const urlParams = new URLSearchParams(window.location.search);
            const encoded = urlParams.get('fb_cfg');
            if (encoded) {
              const decoded = decodeURIComponent(atob(encoded));
              localStorage.setItem('family_firebase_config_raw', decoded);
              // Clean URL after consuming config
              window.history.replaceState({}, document.title, window.location.pathname);
              return decoded;
            }
            return localStorage.getItem('family_firebase_config_raw') || '';
          }
        } catch (e) {}
        return '';
      });

      // Ref to store live Firestore reference
      const firestoreDocRef = useRef(null);
      const isRemoteUpdate = useRef(false);

      // Local persistence storage
      const [favorites, setFavorites] = useState(() => {
        try {
          const stored = localStorage.getItem('family_favorites_list');
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        return INITIAL_FAVORITES;
      });

      const [multiWeekPlans, setMultiWeekPlans] = useState(() => {
        try {
          const stored = localStorage.getItem('family_multi_week_plans_v1');
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        const defaultKey = toWeekKey(getMondayOfWeek(0));
        return { [defaultKey]: createEmptyWeek() };
      });

      const [checkedGroceries, setCheckedGroceries] = useState(() => {
        try {
          const stored = localStorage.getItem('family_groceries_checked');
          if (stored) return JSON.parse(stored);
        } catch (e) {}
        return {};
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [proteinFilter, setProteinFilter] = useState('All');
      const [selectedDayForModal, setSelectedDayForModal] = useState(null);
      const [customMealFormOpen, setCustomMealFormOpen] = useState(false);
      const [copiedNotification, setCopiedNotification] = useState(false);

      const activeMondayDate = useMemo(() => getMondayOfWeek(selectedWeekOffset), [selectedWeekOffset]);
      const activeWeekKey = useMemo(() => toWeekKey(activeMondayDate), [activeMondayDate]);

      const activeSundayDate = useMemo(() => {
        const sun = new Date(activeMondayDate);
        sun.setDate(activeMondayDate.getDate() + 6);
        return sun;
      }, [activeMondayDate]);

      const formattedWeekLabel = useMemo(() => {
        const startStr = activeMondayDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        const endStr = activeSundayDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        return `${startStr} – ${endStr}`;
      }, [activeMondayDate, activeSundayDate]);

      const dayCalendarDates = useMemo(() => {
        const dates = {};
        DAYS_OF_WEEK.forEach((day, index) => {
          const d = new Date(activeMondayDate);
          d.setDate(activeMondayDate.getDate() + index);
          dates[day] = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        });
        return dates;
      }, [activeMondayDate]);

      const currentWeeklyPlan = useMemo(() => {
        return multiWeekPlans[activeWeekKey] || createEmptyWeek();
      }, [multiWeekPlans, activeWeekKey]);

      const [newMeal, setNewMeal] = useState({
        title: '',
        protein: 'Chicken',
        prepTime: '30 mins',
        serves: '4',
        tags: 'Quick, Family',
        ingredients: '',
        sides: '',
        description: ''
      });

      // Local storage backup
      useEffect(() => {
        try {
          localStorage.setItem('family_favorites_list', JSON.stringify(favorites));
          localStorage.setItem('family_multi_week_plans_v1', JSON.stringify(multiWeekPlans));
          localStorage.setItem('family_groceries_checked', JSON.stringify(checkedGroceries));
        } catch (e) {}
      }, [favorites, multiWeekPlans, checkedGroceries]);

      // Cloud Push Function
      const pushToFirestore = (updatedPlans, updatedFavs, updatedChecks) => {
        if (!firestoreDocRef.current) return;
        try {
          firestoreDocRef.current.set({
            multiWeekPlans: updatedPlans || multiWeekPlans,
            favorites: updatedFavs || favorites,
            checkedGroceries: updatedChecks !== undefined ? updatedChecks : checkedGroceries,
            lastUpdatedBy: navigator.userAgent.includes('Mobile') ? 'Phone' : 'Laptop',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(err => {
            console.error("Firestore push error:", err);
            setFirebaseModalMsg(`Sync write error: ${err.message}`);
          });
        } catch (err) {
          console.error("Push invocation error:", err);
        }
      };

      // Dynamic Firebase Connection with Auth & Real-Time Sync
      useEffect(() => {
        const raw = (firebaseConfigInput || '').trim();
        if (!raw) {
          setSyncStatus('Local Mode');
          firestoreDocRef.current = null;
          return;
        }

        if (typeof firebase === 'undefined') {
          setSyncStatus('SDK Missing');
          setFirebaseModalMsg('Firebase script failed to load. Check your internet connection.');
          return;
        }

        let parsedConfig = null;
        try {
          if (raw.startsWith('{') && raw.endsWith('}')) {
            parsedConfig = (new Function(`return ${raw}`))();
          } else {
            const match = raw.match(/\{[\s\S]*\}/);
            if (match) {
              parsedConfig = (new Function(`return ${match[0]}`))();
            }
          }
        } catch (err) {
          setSyncStatus('Config Format Error');
          setFirebaseModalMsg('Could not parse configuration. Ensure opening { and closing } are present.');
          return;
        }

        if (!parsedConfig || !parsedConfig.projectId) {
          setSyncStatus('Missing Project ID');
          setFirebaseModalMsg('Configuration is missing projectId.');
          return;
        }

        let unsubscribe = () => {};
        try {
          const appName = 'family-app-instance';
          let app = firebase.apps.find(a => a.name === appName);
          if (!app) {
            app = firebase.initializeApp(parsedConfig, appName);
          }

          const auth = app.auth();
          const db = app.firestore();
          const docRef = db.collection('family_meals_v1').doc('shared_sync_doc');
          firestoreDocRef.current = docRef;

          setSyncStatus('Authenticating...');

          // Auth is mandatory for Firestore security rules
          auth.signInAnonymously().catch(authErr => {
            console.warn("Anonymous auth warning:", authErr);
          }).finally(() => {
            setSyncStatus('Connecting...');

            unsubscribe = docRef.onSnapshot({ includeMetadataChanges: false }, (snap) => {
              if (snap.exists) {
                const data = snap.data();
                isRemoteUpdate.current = true;
                if (data.multiWeekPlans) setMultiWeekPlans(data.multiWeekPlans);
                if (data.favorites && Array.isArray(data.favorites)) setFavorites(data.favorites);
                if (data.checkedGroceries) setCheckedGroceries(data.checkedGroceries);
                
                setTimeout(() => { isRemoteUpdate.current = false; }, 200);
                setSyncStatus('Live Sync Active 🟢');
                setFirebaseModalMsg('Connected! Changes made here will update your other devices instantly.');
              } else {
                // Initialize default database entry if doc doesn't exist
                docRef.set({
                  multiWeekPlans,
                  favorites,
                  checkedGroceries,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).then(() => {
                  setSyncStatus('Live Sync Active 🟢');
                  setFirebaseModalMsg('Connected & created shared database!');
                }).catch(err => {
                  console.error("Firestore init write error:", err);
                  setSyncStatus('Rules Error ⚠️');
                  setFirebaseModalMsg(`Write blocked: ${err.message}. Follow the rules guide below.`);
                });
              }
            }, (error) => {
              console.error("Firestore listener error:", error);
              if (error.code === 'permission-denied') {
                setSyncStatus('Rules Error ⚠️');
                setFirebaseModalMsg('Permission Denied: Go to Firebase Console -> Firestore Database -> Rules tab, change to: allow read, write: if true; and click Publish.');
              } else {
                setSyncStatus('Sync Error ⚠️');
                setFirebaseModalMsg(`Firestore error (${error.code || 'unknown'}): ${error.message}`);
              }
            });
          });

        } catch (e) {
          console.error("Firebase setup exception:", e);
          setSyncStatus('Setup Error');
          setFirebaseModalMsg(`Error during connection: ${e.message}`);
        }

        return () => {
          unsubscribe();
          firestoreDocRef.current = null;
        };
      }, [firebaseConfigInput]);

      const getMealById = (id) => {
        if (!id) return null;
        return favorites.find(m => m && m.id === id) || BBC_FOOD_SUGGESTIONS.find(m => m && m.id === id) || null;
      };

      const handleAssignMeal = (day, mealId, customTitle = '') => {
        const targetPlan = multiWeekPlans[activeWeekKey] || createEmptyWeek();
        const updatedPlanForWeek = {
          ...targetPlan,
          [day]: {
            ...(targetPlan[day] || {}),
            mealId: mealId,
            customTitle: customTitle,
          }
        };
        const updatedMulti = {
          ...multiWeekPlans,
          [activeWeekKey]: updatedPlanForWeek
        };
        setMultiWeekPlans(updatedMulti);
        pushToFirestore(updatedMulti, null, null);
        setSelectedDayForModal(null);
      };

      const handleClearDay = (day) => {
        const updatedPlanForWeek = {
          ...currentWeeklyPlan,
          [day]: {
            ...(currentWeeklyPlan[day] || {}),
            mealId: null,
            customTitle: '',
            notes: ''
          }
        };
        const updatedMulti = {
          ...multiWeekPlans,
          [activeWeekKey]: updatedPlanForWeek
        };
        setMultiWeekPlans(updatedMulti);
        pushToFirestore(updatedMulti, null, null);
      };

      const handleClearWholeWeek = () => {
        const updatedMulti = {
          ...multiWeekPlans,
          [activeWeekKey]: createEmptyWeek()
        };
        setMultiWeekPlans(updatedMulti);
        pushToFirestore(updatedMulti, null, null);
      };

      const handleUpdateDayNotes = (day, field, value) => {
        const updatedPlanForWeek = {
          ...currentWeeklyPlan,
          [day]: {
            ...(currentWeeklyPlan[day] || {}),
            [field]: value
          }
        };
        const updatedMulti = {
          ...multiWeekPlans,
          [activeWeekKey]: updatedPlanForWeek
        };
        setMultiWeekPlans(updatedMulti);
        pushToFirestore(updatedMulti, null, null);
      };

      const handleDragStart = (e, meal) => {
        setDraggedMeal(meal);
        e.dataTransfer.setData('text/plain', meal.id);
      };

      const handleDragOver = (e, day) => {
        e.preventDefault();
        if (dragOverDay !== day) setDragOverDay(day);
      };

      const handleDrop = (e, day) => {
        e.preventDefault();
        setDragOverDay(null);
        if (draggedMeal) {
          handleAssignMeal(day, draggedMeal.id);
          setDraggedMeal(null);
        }
      };

      const handleAddBbcToFavorites = (bbcRecipe) => {
        if (!bbcRecipe || favorites.some(f => f.title === bbcRecipe.title)) return;
        const converted = {
          id: `fav-bbc-${Date.now()}`,
          title: bbcRecipe.title,
          description: bbcRecipe.matchReason,
          protein: bbcRecipe.protein,
          tags: [...(bbcRecipe.tags || []), 'BBC Discovery'],
          prepTime: bbcRecipe.cookTime,
          serves: '4',
          ingredients: bbcRecipe.ingredients || [],
          sides: 'Rice, seasonal vegetables, or crusty bread',
          source: 'BBC Good Food'
        };
        const updated = [converted, ...favorites];
        setFavorites(updated);
        pushToFirestore(null, updated, null);
        setActiveTab('favorites');
      };

      const handleSmartPlan = () => {
        const available = favorites.length > 0 ? [...favorites] : [...INITIAL_FAVORITES];
        const shuffled = [...available].sort(() => 0.5 - Math.random());
        const newPlan = { ...currentWeeklyPlan };

        DAYS_OF_WEEK.forEach((day, index) => {
          if (day === 'Sunday') {
            const roast = available.find(f => f.tags && f.tags.includes('Sunday Roast')) || available[0];
            newPlan[day] = { ...(newPlan[day] || {}), mealId: roast.id, customTitle: '' };
            return;
          }
          if (day === 'Friday' || day === 'Saturday') {
            const treat = available.find(f => f.tags && (f.tags.includes('BBQ/Grill') || f.tags.includes('Weekend Special') || f.tags.includes('Bistro'))) || shuffled[index % shuffled.length];
            newPlan[day] = { ...(newPlan[day] || {}), mealId: treat.id, customTitle: '' };
            return;
          }
          const picked = shuffled[index % shuffled.length];
          newPlan[day] = { ...(newPlan[day] || {}), mealId: picked.id, customTitle: '' };
        });

        const updatedMulti = {
          ...multiWeekPlans,
          [activeWeekKey]: newPlan
        };
        setMultiWeekPlans(updatedMulti);
        pushToFirestore(updatedMulti, null, null);
      };

      const handleCreateNewMeal = (e) => {
        e.preventDefault();
        if (!newMeal.title.trim()) return;

        const mealObject = {
          id: `custom-${Date.now()}`,
          title: newMeal.title.trim(),
          description: newMeal.description.trim() || 'Family favorite recipe',
          protein: newMeal.protein,
          tags: newMeal.tags.split(',').map(t => t.trim()).filter(Boolean),
          prepTime: newMeal.prepTime.trim() || '30 mins',
          serves: newMeal.serves.trim() || '4',
          ingredients: newMeal.ingredients.split('\n').map(i => i.trim()).filter(Boolean),
          sides: newMeal.sides.trim() || 'Seasonal vegetables / salad',
          source: 'Family Staple'
        };

        const updated = [mealObject, ...favorites];
        setFavorites(updated);
        pushToFirestore(null, updated, null);
        setNewMeal({
          title: '',
          protein: 'Chicken',
          prepTime: '30 mins',
          serves: '4',
          tags: 'Quick, Family',
          ingredients: '',
          sides: '',
          description: ''
        });
        setCustomMealFormOpen(false);
      };

      const toggleGroceryItem = (itemKey) => {
        setCheckedGroceries(prev => {
          const next = { ...prev, [itemKey]: !prev[itemKey] };
          pushToFirestore(null, null, next);
          return next;
        });
      };

      const generateShareLink = () => {
        try {
          const cleanConfig = (firebaseConfigInput || '').trim();
          if (!cleanConfig) return window.location.href;
          const encoded = btoa(encodeURIComponent(cleanConfig));
          const url = new URL(window.location.href);
          url.searchParams.set('fb_cfg', encoded);
          return url.toString();
        } catch (e) {
          return window.location.href;
        }
      };

      const handleCopyShareLink = () => {
        const link = generateShareLink();
        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(link).then(() => {
            setCopiedShareLink(true);
            setTimeout(() => setCopiedShareLink(false), 2500);
          });
        }
      };

      const aggregatedGroceries = useMemo(() => {
        const categories = {
          'Meat & Poultry': [],
          'Fresh Produce & Herbs': [],
          'Pantry, Sauces & Spices': [],
          'Chilled & Dairy': [],
          'Bakery & Carbs': [],
          'Other': []
        };

        const activePlan = multiWeekPlans[activeWeekKey] || createEmptyWeek();

        DAYS_OF_WEEK.forEach(day => {
          const planDay = activePlan[day];
          if (!planDay || !planDay.mealId) return;

          const meal = getMealById(planDay.mealId);
          if (!meal || !Array.isArray(meal.ingredients)) return;

          const dayDateLabel = dayCalendarDates[day] || day;

          meal.ingredients.forEach(rawItem => {
            if (!rawItem) return;
            const itemLower = rawItem.toLowerCase();
            let cat = 'Other';

            if (itemLower.includes('chicken') || itemLower.includes('pork') || itemLower.includes('beef') || itemLower.includes('steak') || itemLower.includes('sausage') || itemLower.includes('mince')) {
              cat = 'Meat & Poultry';
            } else if (itemLower.includes('onion') || itemLower.includes('garlic') || itemLower.includes('herb') || itemLower.includes('mint') || itemLower.includes('coriander') || itemLower.includes('basil') || itemLower.includes('salad') || itemLower.includes('carrot') || itemLower.includes('celery') || itemLower.includes('mushroom') || itemLower.includes('pepper') || itemLower.includes('broccoli') || itemLower.includes('cucumber') || itemLower.includes('lemon') || itemLower.includes('pea') || itemLower.includes('sweetcorn') || itemLower.includes('tomato')) {
              cat = 'Fresh Produce & Herbs';
            } else if (itemLower.includes('soy') || itemLower.includes('sauce') || itemLower.includes('passata') || itemLower.includes('vinegar') || itemLower.includes('honey') || itemLower.includes('stock') || itemLower.includes('mustard') || itemLower.includes('spice') || itemLower.includes('sugar') || itemLower.includes('oil')) {
              cat = 'Pantry, Sauces & Spices';
            } else if (itemLower.includes('parmesan') || itemLower.includes('egg') || itemLower.includes('butter') || itemLower.includes('yoghurt') || itemLower.includes('cream')) {
              cat = 'Chilled & Dairy';
            } else if (itemLower.includes('rice') || itemLower.includes('potato') || itemLower.includes('flatbread') || itemLower.includes('panko') || itemLower.includes('spaghetti') || itemLower.includes('pasta') || itemLower.includes('bread') || itemLower.includes('pastry')) {
              cat = 'Bakery & Carbs';
            }

            const uniqueKey = `${activeWeekKey}-${rawItem.trim()} (for ${meal.title})`;
            if (!categories[cat].some(entry => entry.raw === rawItem)) {
              categories[cat].push({
                id: uniqueKey,
                raw: rawItem,
                mealTitle: meal.title,
                day: `${day} (${dayDateLabel})`
              });
            }
          });
        });

        return categories;
      }, [multiWeekPlans, activeWeekKey, dayCalendarDates, favorites]);

      const filteredFavorites = useMemo(() => {
        return favorites.filter(fav => {
          if (!fav) return false;
          const titleMatch = (fav.title || '').toLowerCase().includes(searchQuery.toLowerCase());
          const ingMatch = Array.isArray(fav.ingredients) && fav.ingredients.some(i => i.toLowerCase().includes(searchQuery.toLowerCase()));
          const tagMatch = Array.isArray(fav.tags) && fav.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesSearch = titleMatch || ingMatch || tagMatch;
          const matchesProtein = proteinFilter === 'All' || (fav.protein || '').toLowerCase().includes(proteinFilter.toLowerCase());
          return matchesSearch && matchesProtein;
        });
      }, [favorites, searchQuery, proteinFilter]);

      const drawerMeals = useMemo(() => {
        const pool = drawerCategory === 'staples' ? favorites : BBC_FOOD_SUGGESTIONS;
        return pool.filter(m => {
          if (!m) return false;
          const search = drawerSearch.toLowerCase();
          return (m.title || '').toLowerCase().includes(search) || (m.protein || '').toLowerCase().includes(search);
        });
      }, [drawerCategory, favorites, drawerSearch]);

      const plannedCount = useMemo(() => {
        return DAYS_OF_WEEK.filter(day => Boolean(currentWeeklyPlan[day]?.mealId || currentWeeklyPlan[day]?.customTitle)).length;
      }, [currentWeeklyPlan]);

      const copyShoppingListText = () => {
        let text = `🛒 Weekly Shopping List (${formattedWeekLabel})\n\n`;
        Object.entries(aggregatedGroceries).forEach(([cat, items]) => {
          if (items.length > 0) {
            text += `== ${cat} ==\n`;
            items.forEach(it => {
              const mark = checkedGroceries[it.id] ? '[x]' : '[ ]';
              text += `${mark} ${it.raw} (for ${it.mealTitle})\n`;
            });
            text += '\n';
          }
        });

        if (navigator?.clipboard?.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            setCopiedNotification(true);
            setTimeout(() => setCopiedNotification(false), 2000);
          });
        }
      };

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800 flex flex-col font-sans">
          {/* Header */}
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center shadow-md">
                    <Icon name="chefHat" className="w-6 h-6" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-xl font-bold tracking-tight text-stone-900">The Family Table</h1>
                      <span className="bg-amber-100 text-amber-800 text-xs font-semibold px-2 py-0.5 rounded-full">
                        Family App
                      </span>
                    </div>
                    <p className="text-xs text-stone-500">Shared meal rotation & live cloud sync</p>
                  </div>
                </div>

                {/* Mobile Direct Cloud Sync Status Button */}
                <button
                  onClick={() => setShowFirebaseModal(true)}
                  className={`sm:hidden flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold border shadow-xs transition active:scale-95 ${
                    syncStatus.includes('Active')
                      ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                      : 'bg-amber-50 text-amber-900 border-amber-300 animate-pulse'
                  }`}
                >
                  <Icon name="cloud" className="w-3.5 h-3.5 text-amber-600" />
                  <span>{syncStatus.includes('Active') ? '🟢 Live' : '☁️ Setup'}</span>
                </button>
              </div>

              <div className="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <button
                  onClick={() => setShowFirebaseModal(true)}

                      onClick={copyShoppingListText}
                      className="px-3 py-1.5 bg-stone-100 text-stone-700 rounded-lg text-xs font-semibold hover:bg-stone-200 flex items-center gap-1.5"
                    >
                      <Icon name="copy" className="w-3.5 h-3.5" />
                      <span>{copiedNotification ? 'Copied!' : 'Copy List'}</span>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  {Object.entries(aggregatedGroceries).map(([category, items]) => {
                    if (!items || items.length === 0) return null;
                    const checkedCount = items.filter(it => checkedGroceries[it.id]).length;

                    return (
                      <div key={category} className="bg-white rounded-xl border border-stone-200 p-4 shadow-xs">
                        <div className="flex items-center justify-between pb-2 mb-3 border-b border-stone-100">
                          <h3 className="font-bold text-stone-800 text-sm">{category}</h3>
                          <span className="text-xs bg-stone-100 text-stone-600 px-2 py-0.5 rounded-full font-medium">
                            {checkedCount} / {items.length}
                          </span>
                        </div>

                        <div className="space-y-2">
                          {items.map(item => {
                            const isChecked = Boolean(checkedGroceries[item.id]);
                            return (
                              <div
                                key={item.id}
                                onClick={() => toggleGroceryItem(item.id)}
                                className={`flex items-start gap-3 p-2 rounded-lg cursor-pointer transition select-none ${
                                  isChecked ? 'bg-stone-50 text-stone-400' : 'hover:bg-amber-50/50 text-stone-800'
                                }`}
                              >
                                <div className={`w-5 h-5 rounded-md flex items-center justify-center mt-0.5 border ${
                                  isChecked ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-stone-300 bg-white'
                                }`}>
                                  {isChecked && <Icon name="check" className="w-3.5 h-3.5" />}
                                </div>
                                <div className="flex-1 text-xs">
                                  <span className={`font-medium ${isChecked ? 'line-through text-stone-400' : 'text-stone-800'}`}>
                                    {item.raw}
                                  </span>
                                  <span className="block text-[10px] text-stone-400 mt-0.5">
                                    For: {item.mealTitle} ({item.day})
                                  </span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* Quick Assign Modal */}
          {mealToAssign && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-4 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-sm">Add to Planner: {mealToAssign.title}</h3>
                  <button onClick={() => setMealToAssign(null)}>
                    <Icon name="close" className="w-4 h-4 text-stone-500" />
                  </button>
                </div>
                <p className="text-xs text-stone-500">Choose day for {formattedWeekLabel}:</p>
                <div className="grid grid-cols-1 gap-2">
                  {DAYS_OF_WEEK.map(day => (
                    <button
                      key={day}
                      onClick={() => {
                        handleAssignMeal(day, mealToAssign.id);
                        setMealToAssign(null);
                        setActiveTab('planner');
                      }}
                      className="p-2.5 rounded-lg border border-stone-200 hover:border-amber-500 hover:bg-amber-50 flex items-center justify-between text-left"
                    >
                      <span className="font-bold text-xs">{day} ({dayCalendarDates[day]})</span>
                      <span className="text-[10px] text-emerald-600 font-semibold">Assign</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Choose Meal Modal */}
          {selectedDayForModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] p-4 flex flex-col shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b">
                  <h3 className="font-bold text-base">Select Meal for {selectedDayForModal}</h3>
                  <button onClick={() => setSelectedDayForModal(null)}>
                    <Icon name="close" className="w-4 h-4 text-stone-500" />
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-2 mt-3 pr-1">
                  {favorites.map(fav => (
                    <div
                      key={fav.id}
                      onClick={() => handleAssignMeal(selectedDayForModal, fav.id)}
                      className="p-3 rounded-xl border border-stone-200 hover:border-amber-500 hover:bg-amber-50/50 cursor-pointer flex items-center justify-between"
                    >
                      <div>
                        <p className="font-bold text-xs text-stone-900">{fav.title}</p>
                        <p className="text-[11px] text-stone-500">{fav.protein} • {fav.prepTime}</p>
                      </div>
                      <Icon name="chevronRight" className="w-4 h-4 text-stone-400" />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Custom Recipe Modal */}
          {customMealFormOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-4 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b mb-3">
                  <h3 className="font-bold text-base">Add New Family Staple</h3>
                  <button onClick={() => setCustomMealFormOpen(false)}>
                    <Icon name="close" className="w-4 h-4 text-stone-500" />
                  </button>
                </div>
                <form onSubmit={handleCreateNewMeal} className="space-y-3">
                  <input
                    type="text"
                    required
                    placeholder="Meal Title (e.g. Mild Butter Chicken)"
                    value={newMeal.title}
                    onChange={(e) => setNewMeal({ ...newMeal, title: e.target.value })}
                    className="w-full text-xs p-2 border rounded-lg"
                  />
                  <div className="grid grid-cols-2 gap-2">
                    <select
                      value={newMeal.protein}
                      onChange={(e) => setNewMeal({ ...newMeal, protein: e.target.value })}
                      className="text-xs p-2 border rounded-lg"
                    >
                      <option value="Chicken">Chicken</option>
                      <option value="Pork">Pork</option>
                      <option value="Beef">Beef</option>
                    </select>
                    <input
                      type="text"
                      placeholder="Cook Time (e.g. 35 mins)"
                      value={newMeal.prepTime}
                      onChange={(e) => setNewMeal({ ...newMeal, prepTime: e.target.value })}
                      className="text-xs p-2 border rounded-lg"
                    />
                  </div>
                  <textarea
                    rows={3}
                    placeholder="Key Ingredients (one per line)"
                    value={newMeal.ingredients}
                    onChange={(e) => setNewMeal({ ...newMeal, ingredients: e.target.value })}
                    className="w-full text-xs p-2 border rounded-lg"
                  />
                  <button
                    type="submit"
                    className="w-full py-2 bg-amber-600 text-white font-semibold text-xs rounded-lg hover:bg-amber-700"
                  >
                    Save to Family Staples
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Cloud Sync Setup Modal */}
          {showFirebaseModal && (
            <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <div className="flex items-center gap-2">
                    <Icon name="cloud" className="w-5 h-5 text-amber-600" />
                    <h3 className="font-bold text-sm text-stone-900">Live Sync (Phone & Laptop)</h3>
                  </div>
                  <button onClick={() => setShowFirebaseModal(false)}>
                    <Icon name="close" className="w-4 h-4 text-stone-400" />
                  </button>
                </div>

                <div className="flex items-center justify-between bg-stone-100 p-2.5 rounded-lg">
                  <span className="text-xs font-semibold text-stone-700">Status:</span>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                    syncStatus.includes('Active')
                      ? 'bg-emerald-100 text-emerald-800'
                      : 'bg-amber-100 text-amber-900'
                  }`}>
                    {syncStatus}
                  </span>
                </div>

                {/* Instant Share Link with Wife / Second Device */}
                {syncStatus.includes('Active') && (
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl space-y-2">
                    <div className="flex items-center justify-between">
                      <p className="text-xs font-bold text-emerald-900">✨ Connect Wife's Phone in 1 Click</p>
                      <button
                        onClick={handleCopyShareLink}
                        className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold rounded-lg flex items-center gap-1 shadow-xs"
                      >
                        <Icon name="copy" className="w-3 h-3" />
                        <span>{copiedShareLink ? 'Link Copied!' : 'Copy Link'}</span>
                      </button>
                    </div>
                    <p className="text-[11px] text-emerald-800 leading-snug">
                      Send this link via WhatsApp/Messages to her phone. When she opens it, it connects automatically with no setup required!
                    </p>
                  </div>
                )}

                <p className="text-xs text-stone-600 leading-relaxed">
                  Paste your Firebase config keys snippet below:
                </p>

                <textarea
                  rows={5}
                  value={firebaseConfigInput}
                  onChange={(e) => {
                    setFirebaseConfigInput(e.target.value);
                    setFirebaseModalMsg('');
                  }}
                  placeholder={`{\n  apiKey: "AIzaSy...",\n  authDomain: "...",\n  projectId: "..."\n}`}
                  className="w-full text-xs font-mono p-2.5 bg-stone-50 border border-stone-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-amber-500"
                />

                {firebaseModalMsg && (
                  <div className={`p-3 rounded-lg text-xs leading-relaxed border ${
                    firebaseModalMsg.includes('Connected')
                      ? 'bg-emerald-50 text-emerald-800 border-emerald-200'
                      : 'bg-amber-50 text-amber-900 border-amber-300 font-medium'
                  }`}>
                    {firebaseModalMsg}
                  </div>
                )}

                <div className="bg-stone-50 p-2.5 rounded-lg border border-stone-200 text-[11px] text-stone-600 space-y-1">
                  <p className="font-bold text-stone-800">Ensure Firestore Rules allow sync:</p>
                  <p>1. In Firebase Console, click <strong>Firestore Database</strong> → <strong>Rules</strong>.</p>
                  <p>2. Make sure it says:</p>
                  <pre className="bg-white p-1 rounded border border-stone-200 text-[10px] text-stone-800 font-mono">
{`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if true;
    }
  }
}`}
                  </pre>
                  <p>3. Click <strong>Publish</strong>.</p>
                </div>

                <div className="flex items-center justify-between pt-1">
                  <button
                    onClick={() => {
                      try {
                        localStorage.setItem('family_firebase_config_raw', firebaseConfigInput);
                        setFirebaseModalMsg('Connecting to database...');
                      } catch (e) {}
                    }}
                    className="w-full py-2.5 bg-amber-600 text-white text-xs font-bold rounded-lg hover:bg-amber-700 transition shadow-xs"
                  >
                    Save & Re-Connect
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Mobile Bottom Bar */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 px-3 py-2 flex items-center justify-around z-40 shadow-lg">
            <button
              onClick={() => setActiveTab('planner')}
              className={`flex flex-col items-center gap-0.5 text-[11px] ${activeTab === 'planner' ? 'text-amber-600 font-bold' : 'text-stone-400'}`}
            >
              <Icon name="calendar" className="w-5 h-5" />
              <span>Plan</span>
            </button>
            <button
              onClick={() => setActiveTab('favorites')}
              className={`flex flex-col items-center gap-0.5 text-[11px] ${activeTab === 'favorites' ? 'text-amber-600 font-bold' : 'text-stone-400'}`}
            >
              <Icon name="utensils" className="w-5 h-5" />
              <span>Staples</span>
            </button>
            <button
              onClick={() => setActiveTab('bbc')}
              className={`flex flex-col items-center gap-0.5 text-[11px] ${activeTab === 'bbc' ? 'text-amber-600 font-bold' : 'text-stone-400'}`}
            >
              <Icon name="sparkles" className="w-5 h-5" />
              <span>BBC</span>
            </button>
            <button
              onClick={() => setActiveTab('groceries')}
              className={`flex flex-col items-center gap-0.5 text-[11px] ${activeTab === 'groceries' ? 'text-amber-600 font-bold' : 'text-stone-400'}`}
            >
              <Icon name="cart" className="w-5 h-5" />
              <span>List</span>
            </button>
            <button
              onClick={() => setShowFirebaseModal(true)}
              className={`flex flex-col items-center gap-0.5 text-[11px] ${syncStatus.includes('Active') ? 'text-emerald-600 font-bold' : 'text-amber-600 font-bold'}`}
            >
              <Icon name="cloud" className="w-5 h-5" />
              <span>{syncStatus.includes('Active') ? 'Synced' : 'Sync'}</span>
            </button>
          </nav>
        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (e) {
      console.error("Mount error:", e);
    }
  </script>
</body>
</html>
